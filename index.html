<section class="qna" id="qna">
  <p class="qna-label">Q&amp;A</p>
  <h2>写作时还是遇到了困难！</h2>
  <p class="qna-intro">在这里留下你的疑问，也可以回复其他人的问题。</p>
  <form class="qna-form" id="question-form">
    <label for="question-text">你的问题</label>
    <textarea id="question-text" rows="4" maxlength="800" placeholder="写下你在新闻写作中遇到的问题……" required></textarea>
    <div class="identity-row">
      <span>发表方式</span>
      <label><input type="radio" name="question-identity" value="anonymous" checked> 匿名</label>
      <label><input type="radio" name="question-identity" value="named"> 实名</label>
      <input class="name-input" id="question-name" type="text" maxlength="30" placeholder="请输入姓名" hidden>
    </div>
    <button type="submit">发表问题</button>
  </form>
  <button class="qna-refresh" id="qna-refresh" type="button">刷新评论</button>
  <div class="qna-list" id="qna-list" aria-live="polite"></div>
</section>
